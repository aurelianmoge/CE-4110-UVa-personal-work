name: Convert Jupyter Notebooks to PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert_notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nbconvert
        run: |
          python -m pip install --upgrade pip
          pip install "nbconvert[webpdf]"

      - name: Convert all notebooks to PDF
        run: |
          mkdir -p pdfs

          for notebook in *.ipynb; do
            [ -e "$notebook" ] || continue

            filename=$(basename "$notebook" .ipynb)

            echo "Converting $notebook..."
            jupyter nbconvert \
              --to webpdf \
              --allow-chromium-download \
              "$notebook" \
              --output-dir pdfs \
              --output "${filename}.pdf"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: converted-notebooks
          path: pdfs/*.pdf
