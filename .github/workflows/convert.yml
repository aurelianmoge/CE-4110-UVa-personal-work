name: Convert Jupyter Notebooks to PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert_notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Jupyter and LaTeX
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Convert Notebook to PDF
        run: |
          jupyter nbconvert --to pdf Homework2.ipynb --output HW2-MOGE-CE6250.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-pdf
          path: HW2-MOGE-CE6250.pdf
