name: Convert Jupyter Notebooks to PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert_notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Notebook to PDF
        uses: yaananth/jupyter-notebooks-to-pdf@v2
        with:
          notebook: "Homework2.ipynb"
          output: "HW2-MOGE-CE6250.pdf"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-pdf
          path: HW2-MOGE-CE6250.pdf
